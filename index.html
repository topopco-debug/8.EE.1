<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8.EE.1 Integer Exponents - Interactive Practice</title>
<style>
  :root {
    --navy: #1a3a5c;
    --navy-dark: #10253d;
    --gold: #c9a227;
    --gold-light: #e8d38a;
    --cream: #faf8f3;
    --red: #b3382c;
    --green: #2e7d47;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    background: var(--cream);
    color: var(--navy-dark);
    margin: 0;
    padding: 0 0 60px 0;
  }
  header {
    background: var(--navy);
    color: var(--cream);
    padding: 24px 20px;
    text-align: center;
    border-bottom: 6px solid var(--gold);
  }
  header h1 {
    margin: 0 0 6px 0;
    font-size: 1.6em;
  }
  header p {
    margin: 0;
    color: var(--gold-light);
    font-size: 0.95em;
  }
  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px;
  }
  .student-field {
    background: #fff;
    border: 2px solid var(--navy);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 24px;
  }
  .student-field label {
    font-weight: bold;
    display: block;
    margin-bottom: 8px;
    color: var(--navy);
  }
  .student-field input {
    width: 100%;
    padding: 10px;
    font-size: 1em;
    font-family: inherit;
    border: 1px solid #999;
    border-radius: 5px;
  }
  .progress-bar {
    background: var(--gold);
    color: var(--navy-dark);
    font-weight: bold;
    padding: 10px 16px;
    border-radius: 6px;
    margin-top: 10px;
    text-align: center;
    font-size: 1.05em;
  }
  .batch {
    display: none;
  }
  .batch.active {
    display: block;
  }
  .question {
    background: #fff;
    margin: 14px 0;
    padding: 16px 18px;
    border-radius: 8px;
    border: 1px solid #ddd;
  }
  .question-text {
    font-weight: bold;
    margin-bottom: 12px;
    color: var(--navy-dark);
  }
  .options label {
    display: block;
    padding: 8px 10px;
    margin-bottom: 6px;
    border: 1px solid #ccc;
    border-radius: 5px;
    cursor: pointer;
    background: #fdfdfd;
  }
  .options label:hover {
    background: #f0ede3;
  }
  .options input[type="radio"] {
    margin-right: 8px;
  }
  .btn-row {
    margin-top: 10px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  button.hint-btn, button.nav-btn, button.submit-btn, button.check-btn, button.answer-btn {
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9em;
  }
  button.hint-btn:hover, button.nav-btn:hover, button.submit-btn:hover, button.check-btn:hover, button.answer-btn:hover {
    background: var(--navy-dark);
  }
  button.check-btn {
    background: var(--green);
  }
  button.check-btn:hover {
    background: #235c36;
  }
  button.check-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  button.answer-btn {
    background: var(--red);
    display: none;
  }
  button.answer-btn:hover {
    background: #8f2c22;
  }
  button.nav-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  button.submit-btn {
    background: var(--gold);
    color: var(--navy-dark);
    font-weight: bold;
    font-size: 1.05em;
    padding: 12px 28px;
  }
  button.submit-btn:hover {
    background: var(--gold-light);
  }
  button.submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .hint-box {
    margin-top: 8px;
    background: #fff8e6;
    border-left: 4px solid var(--gold);
    padding: 8px 12px;
    font-size: 0.9em;
    display: none;
  }
  .feedback {
    margin-top: 8px;
    font-weight: bold;
    font-size: 0.9em;
  }
  .feedback.correct { color: var(--green); }
  .feedback.incorrect { color: var(--red); }
  .explainer {
    margin-top: 10px;
    background: #eaf1fb;
    border-left: 4px solid var(--navy);
    padding: 10px 12px;
    font-size: 0.9em;
    display: none;
  }
  .nav-row {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
  }
  .submit-section {
    text-align: center;
    margin-top: 36px;
    padding: 20px;
    border-top: 2px solid var(--gold);
  }
  .status-msg {
    margin-top: 14px;
    font-weight: bold;
    color: var(--navy);
    font-size: 1.05em;
  }
</style>
</head>
<body>

<header>
  <h1>8.EE.1 Integer Exponents - Interactive Practice</h1>
  <p>Negative Exponents &bull; Product &amp; Quotient of Powers &bull; Mixed Expressions</p>
</header>

<div class="container">

  <div class="student-field">
    <label for="studentName">Student Name:</label>
    <input type="text" id="studentName" placeholder="Type your full name">
  </div>

  <div class="progress-bar" id="progressBar">Questions 1-5 of 25</div>

  <div id="batchContainer"></div>

  <div class="nav-row">
    <button type="button" class="nav-btn" id="backBtn" onclick="goBack()">&larr; Back</button>
    <button type="button" class="nav-btn" id="nextBtn" onclick="goNext()">Next &rarr;</button>
  </div>

  <div class="submit-section">
    <button class="submit-btn" id="submitBtn" onclick="submitQuiz()">Submit Activity</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>

</div>

<script>
/* =========================================================
   CONFIG: paste your deployed Google Apps Script Web App URL here
   ========================================================= */
const GAS_WEB_APP_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnRoAZD0PvfEP4nUVc50h_VibW3lBr8sRt5iSK3s4w7on2oJJZN7S8Obi8fypwJB9nVJU1AzYe39ZmU-oiTr12S9E07iTFClbYOmx_lcl9Rm-nmCJgxuUqKqWfM6OIGVQYS30mh-Hf2ETacXmshH4ROYLR-ZG1OXVnMX2XgWyfhAWXiQkbdkFoHY47C6B2HtF_YSCyosKTzAwEjUhOcwbwPKHLq-ozflq6Uu_3b6WKgHwGPzMm8c1znkHfWEIE3OE8StVxHqWL8GU100hPso025ytlHl6g&lib=M5iSZjfaaOcZqpTrS26di6D454GxaOlPt";

const BATCH_SIZE = 5;
const TOTAL_QUESTIONS = 25;

/* =========================================================
   QUESTION DATA
   ========================================================= */
const questions = [
  { id: 1, text: "Evaluate: 2<sup>-5</sup>", options: { A: "1/32", B: "32", C: "-32", D: "-1/32" }, correct: "A",
    hint: "A negative exponent means write the reciprocal of the base raised to the positive exponent.",
    explainer: "Correct answer: A. 2<sup>-5</sup> = 1/2<sup>5</sup> = 1/32. A negative exponent does not make the answer negative - it means 'take the reciprocal.'" },
  { id: 2, text: "Evaluate: 3<sup>-2</sup>", options: { A: "9", B: "1/9", C: "-9", D: "-1/9" }, correct: "B",
    hint: "Rewrite as 1 over the base raised to the positive version of the exponent.",
    explainer: "Correct answer: B. 3<sup>-2</sup> = 1/3<sup>2</sup> = 1/9." },
  { id: 3, text: "Evaluate: 10<sup>-4</sup>", options: { A: "10000", B: "-10000", C: "1/10000", D: "-1/10000" }, correct: "C",
    hint: "Move the base to the denominator and make the exponent positive.",
    explainer: "Correct answer: C. 10<sup>-4</sup> = 1/10<sup>4</sup> = 1/10000." },
  { id: 4, text: "Evaluate: 1<sup>-15</sup>", options: { A: "-1", B: "15", C: "-15", D: "1" }, correct: "D",
    hint: "1 raised to any power - positive or negative - is always the same value.",
    explainer: "Correct answer: D. Any power of 1 equals 1, so 1<sup>-15</sup> = 1." },
  { id: 5, text: "Evaluate: 8<sup>-1</sup>", options: { A: "1/8", B: "8", C: "-8", D: "-1/8" }, correct: "A",
    hint: "A power of -1 is just the reciprocal of the base.",
    explainer: "Correct answer: A. 8<sup>-1</sup> = 1/8." },
  { id: 6, text: "Evaluate: 7<sup>-2</sup>", options: { A: "49", B: "1/49", C: "-49", D: "-1/49" }, correct: "B",
    hint: "Square the base, then take the reciprocal.",
    explainer: "Correct answer: B. 7<sup>-2</sup> = 1/7<sup>2</sup> = 1/49." },

  { id: 7, text: "Apply the product of powers rule: 5<sup>-2</sup> &times; 5<sup>-7</sup>", options: { A: "1953125", B: "1/25", C: "1/1953125", D: "1/78125" }, correct: "C",
    hint: "Same base being multiplied - add the exponents: -2 + (-7).",
    explainer: "Correct answer: C. Add the exponents: -2 + (-7) = -9, so 5<sup>-2</sup> &times; 5<sup>-7</sup> = 5<sup>-9</sup> = 1/1953125." },
  { id: 8, text: "Apply the product of powers rule: 3<sup>4</sup> &times; 3<sup>-4</sup>", options: { A: "0", B: "6561", C: "81", D: "1" }, correct: "D",
    hint: "Add the exponents. What is any nonzero number raised to the 0 power?",
    explainer: "Correct answer: D. 4 + (-4) = 0, and any nonzero base raised to the 0 power equals 1." },
  { id: 9, text: "Apply the product of powers rule: 2<sup>-6</sup> &times; 2<sup>2</sup>", options: { A: "1/16", B: "16", C: "1/4", D: "4" }, correct: "A",
    hint: "Add the exponents: -6 + 2.",
    explainer: "Correct answer: A. -6 + 2 = -4, so 2<sup>-6</sup> &times; 2<sup>2</sup> = 2<sup>-4</sup> = 1/16." },
  { id: 10, text: "Apply the product of powers rule: 7<sup>2</sup> &times; 7<sup>-3</sup>", options: { A: "7", B: "1/7", C: "-7", D: "1/49" }, correct: "B",
    hint: "Add the exponents: 2 + (-3).",
    explainer: "Correct answer: B. 2 + (-3) = -1, so 7<sup>2</sup> &times; 7<sup>-3</sup> = 7<sup>-1</sup> = 1/7." },
  { id: 11, text: "Apply the product of powers rule: 4<sup>-4</sup> &times; 4<sup>-5</sup>", options: { A: "262144", B: "1/1048576", C: "1/262144", D: "1/65536" }, correct: "C",
    hint: "Add the exponents: -4 + (-5).",
    explainer: "Correct answer: C. -4 + (-5) = -9, so 4<sup>-4</sup> &times; 4<sup>-5</sup> = 4<sup>-9</sup> = 1/262144." },
  { id: 12, text: "Apply the product of powers rule: 3<sup>5</sup> &times; 3<sup>-2</sup>", options: { A: "1/27", B: "2187", C: "1/2187", D: "27" }, correct: "D",
    hint: "Add the exponents: 5 + (-2).",
    explainer: "Correct answer: D. 5 + (-2) = 3, so 3<sup>5</sup> &times; 3<sup>-2</sup> = 3<sup>3</sup> = 27." },

  { id: 13, text: "Apply the quotient of powers rule: 3<sup>6</sup> / 3<sup>-2</sup>", options: { A: "6561", B: "1/6561", C: "81", D: "1/81" }, correct: "A",
    hint: "Same base being divided - subtract the exponents: 6 - (-2).",
    explainer: "Correct answer: A. 6 - (-2) = 8, so 3<sup>6</sup> / 3<sup>-2</sup> = 3<sup>8</sup> = 6561." },
  { id: 14, text: "Apply the quotient of powers rule: 10<sup>-3</sup> / 10<sup>3</sup>", options: { A: "1000000", B: "1/1000000", C: "1", D: "1/1000" }, correct: "B",
    hint: "Subtract the exponents: -3 - 3.",
    explainer: "Correct answer: B. -3 - 3 = -6, so 10<sup>-3</sup> / 10<sup>3</sup> = 10<sup>-6</sup> = 1/1000000." },
  { id: 15, text: "Apply the quotient of powers rule: 5<sup>-6</sup> / 5<sup>-5</sup>", options: { A: "5", B: "1/25", C: "1/5", D: "25" }, correct: "C",
    hint: "Subtract the exponents: -6 - (-5).",
    explainer: "Correct answer: C. -6 - (-5) = -1, so 5<sup>-6</sup> / 5<sup>-5</sup> = 5<sup>-1</sup> = 1/5." },
  { id: 16, text: "Apply the quotient of powers rule: 3<sup>-3</sup> / 3<sup>-5</sup>", options: { A: "1/9", B: "1/6561", C: "6561", D: "9" }, correct: "D",
    hint: "Subtract the exponents: -3 - (-5).",
    explainer: "Correct answer: D. -3 - (-5) = 2, so 3<sup>-3</sup> / 3<sup>-5</sup> = 3<sup>2</sup> = 9." },

  { id: 17, text: "Find the value: 4 &times; 5<sup>-3</sup>", options: { A: "4/125", B: "-12", C: "-4/125", D: "1/500" }, correct: "A",
    hint: "Only the base with the exponent gets the reciprocal - the coefficient (4) stays multiplied out front.",
    explainer: "Correct answer: A. 5<sup>-3</sup> = 1/125, so 4 &times; 5<sup>-3</sup> = 4 &times; 1/125 = 4/125." },
  { id: 18, text: "Find the value: 6 &times; 3<sup>-4</sup>", options: { A: "2/9", B: "2/27", C: "-2/27", D: "2" }, correct: "B",
    hint: "Evaluate 3<sup>-4</sup> first, then multiply by 6 and simplify.",
    explainer: "Correct answer: B. 3<sup>-4</sup> = 1/81, so 6 &times; 1/81 = 6/81, which simplifies to 2/27." },
  { id: 19, text: "Find the value: -5 &times; 10<sup>2</sup>", options: { A: "500", B: "-50", C: "-500", D: "50" }, correct: "C",
    hint: "10<sup>2</sup> is a positive exponent here - just evaluate it normally, then multiply by -5.",
    explainer: "Correct answer: C. 10<sup>2</sup> = 100, and -5 &times; 100 = -500." },
  { id: 20, text: "Find the value: 6 / 2<sup>-8</sup>", options: { A: "6/256", B: "1/1536", C: "-1536", D: "1536" }, correct: "D",
    hint: "Dividing by a negative exponent is the same as multiplying by the positive version of that power.",
    explainer: "Correct answer: D. Dividing by 2<sup>-8</sup> is the same as multiplying by 2<sup>8</sup> = 256, so 6 &times; 256 = 1536." },

  { id: 21, text: "Evaluate: 6<sup>-2</sup>", options: { A: "1/36", B: "36", C: "-36", D: "-1/36" }, correct: "A",
    hint: "Square the base, then take the reciprocal.",
    explainer: "Correct answer: A. 6<sup>-2</sup> = 1/6<sup>2</sup> = 1/36." },
  { id: 22, text: "Apply the product of powers rule: 2<sup>-3</sup> &times; 2<sup>5</sup>", options: { A: "1/4", B: "4", C: "256", D: "1/256" }, correct: "B",
    hint: "Add the exponents: -3 + 5.",
    explainer: "Correct answer: B. -3 + 5 = 2, so 2<sup>-3</sup> &times; 2<sup>5</sup> = 2<sup>2</sup> = 4." },
  { id: 23, text: "Evaluate: 9<sup>0</sup>", options: { A: "0", B: "9", C: "1", D: "-1" }, correct: "C",
    hint: "Any nonzero number raised to the 0 power follows the same rule.",
    explainer: "Correct answer: C. Any nonzero base raised to the 0 power equals 1, so 9<sup>0</sup> = 1." },
  { id: 24, text: "Apply the product of powers rule: 10<sup>-2</sup> &times; 10<sup>-1</sup>", options: { A: "1000", B: "1/100", C: "1/10", D: "1/1000" }, correct: "D",
    hint: "Add the exponents: -2 + (-1).",
    explainer: "Correct answer: D. -2 + (-1) = -3, so 10<sup>-2</sup> &times; 10<sup>-1</sup> = 10<sup>-3</sup> = 1/1000." },
  { id: 25, text: "Find the value: 8 / 2<sup>-3</sup>", options: { A: "64", B: "1/64", C: "8", D: "-64" }, correct: "A",
    hint: "Dividing by a negative exponent is the same as multiplying by the positive version of that power.",
    explainer: "Correct answer: A. Dividing by 2<sup>-3</sup> is the same as multiplying by 2<sup>3</sup> = 8, so 8 &times; 8 = 64." }
];

const state = {};
questions.forEach(q => { state[q.id] = { attempts: 0, locked: false }; });

let currentBatch = 0;
const totalBatches = Math.ceil(TOTAL_QUESTIONS / BATCH_SIZE);

function buildQuiz() {
  const container = document.getElementById("batchContainer");

  for (let b = 0; b < totalBatches; b++) {
    const batchDiv = document.createElement("div");
    batchDiv.className = "batch" + (b === 0 ? " active" : "");
    batchDiv.id = "batch-" + b;

    const startIdx = b * BATCH_SIZE;
    const endIdx = Math.min(startIdx + BATCH_SIZE, TOTAL_QUESTIONS);

    for (let i = startIdx; i < endIdx; i++) {
      const q = questions[i];
      const div = document.createElement("div");
      div.className = "question";
      div.id = "q" + q.id;

      let optionsHtml = "";
      ["A", "B", "C", "D"].forEach(letter => {
        optionsHtml += `
          <label>
            <input type="radio" name="q${q.id}" value="${letter}">
            <strong>${letter}.</strong> ${q.options[letter]}
          </label>`;
      });

      div.innerHTML = `
        <div class="question-text">Question ${q.id}. ${q.text}</div>
        <div class="options">${optionsHtml}</div>
        <div class="btn-row">
          <button type="button" class="hint-btn" onclick="toggleHint(${q.id})">Hint</button>
          <button type="button" class="check-btn" id="check-btn-${q.id}" onclick="checkAnswer(${q.id})">Submit Answer</button>
          <button type="button" class="answer-btn" id="answer-btn-${q.id}" onclick="showAnswer(${q.id})">Show Answer</button>
        </div>
        <div class="hint-box" id="hint-${q.id}">${q.hint}</div>
        <div class="feedback" id="feedback-${q.id}"></div>
        <div class="explainer" id="explainer-${q.id}">${q.explainer}</div>
      `;
      batchDiv.appendChild(div);
    }
    container.appendChild(batchDiv);
  }
  updateNav();
}

function updateNav() {
  document.getElementById("backBtn").disabled = (currentBatch === 0);
  document.getElementById("nextBtn").disabled = (currentBatch === totalBatches - 1);

  const startQ = currentBatch * BATCH_SIZE + 1;
  const endQ = Math.min(startQ + BATCH_SIZE - 1, TOTAL_QUESTIONS);
  document.getElementById("progressBar").textContent = `Questions ${startQ}-${endQ} of ${TOTAL_QUESTIONS}`;
}

function goNext() {
  if (currentBatch < totalBatches - 1) {
    document.getElementById("batch-" + currentBatch).classList.remove("active");
    currentBatch++;
    document.getElementById("batch-" + currentBatch).classList.add("active");
    updateNav();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function goBack() {
  if (currentBatch > 0) {
    document.getElementById("batch-" + currentBatch).classList.remove("active");
    currentBatch--;
    document.getElementById("batch-" + currentBatch).classList.add("active");
    updateNav();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function toggleHint(id) {
  const box = document.getElementById("hint-" + id);
  box.style.display = (box.style.display === "block") ? "none" : "block";
}

const ATTEMPTS_BEFORE_ANSWER_BUTTON = 2;

function checkAnswer(id) {
  const q = questions.find(item => item.id === id);
  const feedback = document.getElementById("feedback-" + id);
  const answerBtn = document.getElementById("answer-btn-" + id);
  const checkBtn = document.getElementById("check-btn-" + id);

  if (state[id].locked) return;

  const chosen = getSelected(id);
  if (!chosen) {
    alert("Please select an answer before clicking Submit Answer.");
    return;
  }

  if (chosen === q.correct) {
    feedback.textContent = "Correct!";
    feedback.className = "feedback correct";
    state[id].locked = true;
    checkBtn.disabled = true;
  } else {
    state[id].attempts += 1;
    const remaining = ATTEMPTS_BEFORE_ANSWER_BUTTON - state[id].attempts;
    if (remaining > 0) {
      feedback.textContent = `Not quite - try again. (${remaining} attempt${remaining === 1 ? "" : "s"} left before the Show Answer button appears)`;
      feedback.className = "feedback incorrect";
    } else {
      feedback.textContent = "Not quite. Click \"Show Answer\" for a detailed explanation, or keep trying.";
      feedback.className = "feedback incorrect";
      answerBtn.style.display = "inline-block";
    }
  }
}

function showAnswer(id) {
  const explainerBox = document.getElementById("explainer-" + id);
  explainerBox.style.display = "block";
}

function getSelected(id) {
  const chosen = document.querySelector(`input[name="q${id}"]:checked`);
  return chosen ? chosen.value : "";
}

function submitQuiz() {
  const name = document.getElementById("studentName").value.trim();
  const statusMsg = document.getElementById("statusMsg");

  if (!name) {
    alert("Please enter your name before submitting.");
    return;
  }

  const answers = questions.map(q => getSelected(q.id));

  const payload = {
    timestamp: new Date().toISOString(),
    student: name,
    answers: answers
  };

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  statusMsg.textContent = "Submitting...";

  fetch(GAS_WEB_APP_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(() => {
    statusMsg.textContent = "Submitted! Thank you, " + name + ".";
  }).catch(() => {
    statusMsg.textContent = "Submission may have failed - check your connection and try again.";
    submitBtn.disabled = false;
  });
}

buildQuiz();
</script>

</body>
</html>
